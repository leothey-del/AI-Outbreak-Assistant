name: Build and Verify Code

# This triggers the pipeline automatically whenever someone pushes to your branch
on:
  push:
    branches: [ main, feature/setup-cicd ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository onto the cloud server
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the Node.js runner environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Cleanly install all your packages/dependencies
      - name: Install Project Dependencies
        run: npm ci

      # 4. Compile TypeScript / Build the project to make sure there are no syntax errors
      - name: Compile and Build Project
        run: npm run build --if-present